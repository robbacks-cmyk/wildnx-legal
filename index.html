<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WildNX</title>
<style>
  :root {
    --gold: #B8860B;
    --ink: #1a1a1a;
    --muted: #5a5a5a;
    --rule: #e0ddd6;
    --paper: #fbfaf7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
  .brand {
    font-size: 13px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); font-weight: 700; margin: 0 0 .5rem;
  }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 1.5rem; font-weight: 700; }
  p { margin: 0 0 1rem; }
  .links {
    list-style: none; margin: 2rem 0 0; padding: 0;
    border-top: 1px solid var(--rule);
  }
  .links li { border-bottom: 1px solid var(--rule); }
  .links a {
    display: block; padding: 1rem 0; color: var(--ink);
    text-decoration: none; font-weight: 700; font-size: 1.05rem;
  }
  .links a:hover { color: var(--gold); }
  .links span { display: block; color: var(--muted); font-weight: 400; font-size: 15px; margin-top: .15rem; }
  footer {
    margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 15px;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">WildNX</p>
  <h1>Hunt alone. Never lost.</h1>
  <p>WildNX is a hunting app for British Columbia.</p>

  <ul class="links">
    <li><a href="privacy.html">Privacy Policy<span>What the app collects, where it goes, and how to delete it.</span></a></li>
    <li><a href="support.html">Support<span>Get help or ask a question.</span></a></li>
  </ul>

  <footer>
    WildNX — British Columbia, Canada
  </footer>
</div>
</body>
</html>
